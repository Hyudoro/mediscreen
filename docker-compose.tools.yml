# SonarQube and the Creedengo Java plugin (formerly ecoCode), for the Green
# Code analysis. A separate file on purpose: the daily `docker compose up`
# stays light, and this stack runs only while measuring.
name: mediscreen-tools

services:
  sonarqube:
    build: tools/sonar
    ports:
      - "127.0.0.1:9001:9000" # the gateway owns 9000; SonarQube listens on 9000 inside
    environment:
      # Production-mode Elasticsearch: it verifies vm.max_map_count and file
      # descriptors before starting, instead of starting degraded.
      SONAR_ES_BOOTSTRAP_CHECKS: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      # No volume on /opt/sonarqube/extensions: the plugin is baked into the
      # image, and a named volume there would keep serving the plugin version
      # it first copied in, never the rebuilt one.

volumes:
  sonarqube_data:
  sonarqube_logs:
