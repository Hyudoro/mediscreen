name: mediscreen

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mediscreen
      POSTGRES_DB: mediscreen
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app
    ports:
      - "127.0.0.1:5432:5432"

  mongo:
    image: mongo:8.3
    environment:
      MONGO_INITDB_ROOT_USERNAME: mediscreen
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo-password
    secrets:
      - mongo-password
    volumes:
      - mongo-data:/data/db
    networks:
      - app
    ports:
      - "127.0.0.1:27017:27017"

secrets:
  postgres-password:
    file: ./secrets/postgres-password
  mongo-password:
    file: ./secrets/mongo-password

volumes:
  postgres-data:
  mongo-data:

networks:
  app:
