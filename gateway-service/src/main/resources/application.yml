spring:
  application:
    name: gateway-service
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: ${mediscreen.services.patient-uri}
              predicates:
                - Path=/api/v1/patients/**
            - id: note-service
              uri: ${mediscreen.services.note-uri}
              predicates:
                - Path=/api/v1/notes/**

server:
  port: 9000

mediscreen:
  services:
    patient-uri: http://localhost:8081
    note-uri: http://localhost:8082

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: docker
mediscreen:
  services:
    patient-uri: http://patient-service:8081
    note-uri: http://note-service:8082
